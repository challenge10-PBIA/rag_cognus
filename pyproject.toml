[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-cognus"
version = "0.1.0"
description = "RAG LangChain com Qwen/Ollama, Gold Databricks e avaliações MLflow"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1.0,<2",
  "langchain-ollama>=1.0,<2",
  "mlflow>=3.6,<4",
  "databricks-sdk>=0.70,<1",
  "rank-bm25>=0.2.2,<0.3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
ui = ["streamlit>=1.50,<2"]

[project.scripts]
rag-cognus = "rag_cognus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
